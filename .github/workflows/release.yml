name: Release app

# Manual only (Actions → Release app → Run workflow). Releases are
# normally published from the owner's Mac with scripts/publish-release.sh,
# which uses no GitHub minutes; a v* tag no longer starts this workflow.
on:
  workflow_dispatch:

# Creating a GitHub Release needs write access to the repository contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    name: Build ShotStyle.app
    # Same runner as CI: ShotStyle builds against the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out ShotStyle
        uses: actions/checkout@v6

      - name: Show the toolchain
        run: xcodebuild -version && swift --version

      # Ad-hoc signed (no certificate on the runner), Apple Silicon + Intel,
      # left in .build/app.noindex instead of being copied to /Applications.
      - name: Build the app
        env:
          SHOTSTYLE_CODESIGN_IDENTITY: "-"
          SHOTSTYLE_UNIVERSAL: "true"
          SHOTSTYLE_INSTALL: "false"
        run: bash build-app.sh

      - name: Check the app
        run: |
          APP=.build/app.noindex/ShotStyle.app
          lipo -archs "$APP/Contents/MacOS/ShotStyle"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -d "$APP/Contents/Resources/ShotStyle_ShotStyleCore.bundle"

      - name: Zip the app
        working-directory: .build/app.noindex
        run: ditto -c -k --keepParent ShotStyle.app "$GITHUB_WORKSPACE/ShotStyle.zip"

      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShotStyle
          path: ShotStyle.zip
          if-no-files-found: error

      - name: Attach the zip to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Install

          1. Download **ShotStyle.zip** below and unzip it.
          2. Drag **ShotStyle** to your Applications folder.
          3. This build isn't notarized by Apple, so once, in Terminal, run:

             ```
             xattr -dr com.apple.quarantine /Applications/ShotStyle.app
             ```

          4. Open ShotStyle.
          5. Allow **Screen Recording** when macOS asks (System Settings → Privacy & Security → Screen Recording), then quit and reopen ShotStyle.

          Runs on Apple Silicon and Intel Macs with macOS 13 or later.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ShotStyle.zip --clobber
          else
            gh release create "$TAG" ShotStyle.zip \
              --title "ShotStyle $TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
